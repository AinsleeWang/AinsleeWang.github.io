name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npm run build
      - run: node scripts/check-links.mjs
      - run: scripts/check-colors.sh
      - name: Type rules in a browser
        run: |
          npx astro preview --port 4321 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4321/ > /dev/null && break; sleep 1; done
          POST="$(ls dist/posts | head -1)"
          node scripts/check-type.mjs \
            http://localhost:4321/ \
            http://localhost:4321/about/ \
            http://localhost:4321/archive/ \
            "http://localhost:4321/posts/$POST/"
