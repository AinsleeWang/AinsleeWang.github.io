<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="wit.et favicon symbol">
  <title>wit.et favicon — moss-600</title>
  <style>
    :root { --moss-600: #4A593D; }
    .w-line { fill: none; stroke: var(--moss-600); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .w-node { fill: var(--moss-600); }
  </style>
  <!-- bolder geometry tuned for 16px legibility: thicker stroke, larger nodes, ring dropped in favor of a solid accent node -->
  <path class="w-line" d="M8,39.5 L29,60.5 L50,39.5 L71,60.5 L92,39.5" />
  <circle class="w-node" cx="8" cy="39.5" r="6" />
  <circle class="w-node" cx="29" cy="60.5" r="4.5" />
  <circle class="w-node" cx="50" cy="39.5" r="8" />
  <circle class="w-node" cx="71" cy="60.5" r="4.5" />
  <!-- E: ring replaced with a solid, slightly larger accent circle (r=6.5, +20% vs A's 6) to preserve the terminal-node emphasis at small sizes -->
  <circle class="w-node" cx="92" cy="39.5" r="6.5" />
</svg>
